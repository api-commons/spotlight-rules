---
layout: default
nav: blog
---

<article>

  <p class="text-muted small mb-1">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.author %} · {{ page.author }}{% endif %}
  </p>

  <h1>{{ page.title }}</h1>

  {% if page.description %}
  <p class="lede">{{ page.description }}</p>
  {% endif %}

  {% if page.image %}
  <img src="{{ page.image }}" alt="" class="img-fluid rounded my-4 d-block">
  {% endif %}

  <hr class="my-4">

  {{ content }}

</article>

<hr class="my-4">

<p class="mt-4">
  <a class="btn btn-outline-primary" href="/blog/">← All posts</a>
  <a class="btn btn-primary ms-2" href="{{ site.discussion }}">Join the discussion →</a>
</p>
