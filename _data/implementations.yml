  evidence: https://support.smartbear.com/swagger/studio/docs/en/api-governance.html

- name: Apigee API hub
  url: https://docs.cloud.google.com/apigee/docs/apihub/validate-spec
  relationship: embeds
  language: hosted service
  browser: n/a
  verified: true
  summary: >-
    Google Cloud's API hub ships a built-in Spectral linter that validates every OpenAPI added to
    an API version, reporting findings in the console. What the product calls a "style guide" is
    an uploaded ruleset, with the documented constraint that it cannot reference remote URLs in
    `extends` — a portability limit worth specifying against.
  evidence: https://docs.cloud.google.com/apigee/docs/apihub/validate-spec

- name: Postman
  url: https://learning.postman.com/docs/api-governance/configurable-rules/spectral
  relationship: embeds
  language: hosted service
  browser: n/a
  verified: true
  summary: >-
    Postman's configurable API governance and security rulesets are Spectral v6 rules, including
    custom JavaScript functions in ES6 or CommonJS. The documentation teaches the ruleset format
    directly to users who have never installed the linter.
  evidence: https://learning.postman.com/docs/api-governance/configurable-rules/spectral

- name: IBM API Connect
  url: https://www.ibm.com/docs/en/api-connect/saas?topic=tools-api-governance
  relationship: embeds
  language: hosted service
  browser: n/a
  verified: true
  summary: >-
    The governance service validates API and product documents against Spectral rulesets from the
    API Manager UI, the Designer, or the toolkit CLI. Pre-configured global rulesets are named
    `spectral-*` and versioned to match upstream, while custom provider-organization rulesets are
    restricted to the built-in core functions — a vendor pinning itself to the format's version
    and its function set, with no specification to pin to.
  evidence: https://www.ibm.com/docs/en/api-connect/saas?topic=tools-api-governance

- name: Axway Amplify Engage
  url: https://blog.axway.com/learning-center/apis/api-design/api-linting-api-governance
  relationship: embeds
  language: hosted service
  browser: n/a
  verified: true
  summary: >-
    Rulesets execute automatically as services are discovered, so every discovered API carries a
    compliance grade before anyone opens it. Governance applied at discovery rather than at
    authoring — a different insertion point for the same artifact.
  evidence: https://blog.axway.com/learning-center/apis/api-design/api-linting-api-governance

- name: Insomnia / Inso CLI
  url: https://developer.konghq.com/how-to/add-custom-linting-rules/
  relationship: embeds
  language: TypeScript / JavaScript
  browser: false
  verified: true
  summary: >-
    Kong's API client picks up a `.spectral.yaml` sitting beside the specification, defaults to
    the standard OAS ruleset, and supports `extends` for organization rules — across local, cloud
    and Git-synced projects, with the same file working in the desktop app and in CI via Inso.
  evidence: https://developer.konghq.com/how-to/add-custom-linting-rules/

- name: Bump.sh
  url: https://docs.bump.sh/guides/bump-sh-tutorials/api-linting-with-vacuum/
  relationship: embeds
  language: hosted service
  browser: n/a
  verified: true
  summary: >-
    Lints with the Go engine rather than the original one, defaulting to the Spectral OAS ruleset,
    with existing rulesets carried over through a `spectral:` compatibility alias. A clean example
    of the format outliving the implementation that defined it.
  evidence: https://docs.bump.sh/guides/bump-sh-tutorials/api-linting-with-vacuum/

- name: decK file lint
  url: https://developer.konghq.com/deck/file/lint/
  relationship: embeds
  language: Go
  browser: false
  verified: true
  summary: >-
    Kong's gateway configuration CLI lints any JSON or YAML file against Spectral-compatible
    rulesets, implemented on the Go engine. Notable because the target is gateway configuration,
    not an API description — the format being applied well outside the problem it was written for.
  evidence: https://developer.konghq.com/deck/file/lint/

- name: api-oas-checker
  url: https://italia.github.io/api-oas-checker/
  relationship: embeds
  language: JavaScript
  browser: true
  verified: true
  summary: >-
    The Italian government's OpenAPI checker — a static browser application, no server or database,
    that lints against the national API guidelines with the engine running client-side. The rules
    are maintained as a separate public repository, which is what a national standard published as
    a ruleset actually looks like in practice.
  evidence: https://github.com/italia/api-oas-checker

- name: Backstage API Docs Spectral Linter
  url: https://roadie.io/backstage/plugins/api-spectral-linter/
  relationship: embeds
  language: TypeScript / JavaScript
  browser: false
  verified: true
  summary: >-
    A community plugin that adds a linter tab to API entities inside an internal developer portal,
    with a default ruleset or a per-entity one set by catalog annotation. The format reaching
    developers where they already are, through somebody else's interface.
  evidence: https://github.com/dweber019/backstage-plugins/tree/main/plugins/api-docs-spectral-linter

- name: AEP OpenAPI Linter
  url: https://github.com/aep-dev/aep-openapi-linter
  relationship: ruleset
  language: YAML / JavaScript
  browser: false
  verified: true
  summary: >-
    The API Enhancement Proposals (aep.dev) publish their API guidelines as a ruleset rather
    than as prose alone — conformance to the guidelines is checkable. `spectral.yaml` extends
    `spectral:oas` and then composes one sub-ruleset per AEP (0004, 0122, 0131…0193) by relative
    path, with custom JavaScript functions declared through `functionsDir`. It ships as an npm
    package (`@aep_dev/aep-openapi-linter`, MIT) and is also consumed by raw URL, pinned to a
    release tag. A standards body treating the format as its publication medium — and a working
    exercise of `extends` composition, remote resolution, and version pinning all at once. Raised
    by Mike Kistler, its author, in the fork discussion.
  evidence: https://github.com/aep-dev/aep-openapi-linter#readme

- name: Italian API guidelines rules
  url: https://github.com/italia/api-oas-checker-rules
  relationship: ruleset
  language: YAML
  browser: false
  verified: true
  summary: >-
    The shared rules behind Italy's national API interoperability model (ModI), maintained as a
    public ruleset repository in its own right, separate from the browser checker that runs them.
    The rules outlive any one interface — which is the whole argument for specifying the format
    they are written in.
  evidence: https://github.com/italia/api-oas-checker-rules

- name: Redocly CLI
  url: https://github.com/Redocly/redocly-cli
  relationship: adjacent
  language: TypeScript / JavaScript
  browser: false
  verified: true
  summary: >-
    Its own linting engine and its own rules model, configured through `redocly.yaml` rather
    than a Spectral ruleset. Relevant here as substantial prior art on the same problem, and as
    a design comparison for anyone specifying a rules format.
  evidence: https://github.com/Redocly/redocly-cli#readme

- name: SpecLynx
  url: https://github.com/speclynx
  relationship: adjacent
  language: TypeScript
  browser: true
  verified: true
  summary: >-
    An independent line of API tooling — a CLI (`overlay`, `validate`), a browser-based editor,
    and a VS Code toolkit — built on its own fork of ApiDOM, the semantic parser that underpins
    much of the serious Swagger-era tooling. Not a consumer of the ruleset format today, and
    among the most capable and least known parsing and validation stacks in this space.
  evidence: https://github.com/speclynx/speclynx-cli#readme

- name: APIMatic
  url: https://www.apimatic.io/
  relationship: unknown
  language: hosted service
  browser: n/a
  verified: false
  summary: >-
    Commercial API tooling with its own validation and transformation layer, and a long-standing
    presence in this space. Listed because it occupies the same problem space; the relationship to
    the ruleset format is not established here. Correction welcome.
  evidence: https://www.apimatic.io/

- name: Zally
  url: https://github.com/zalando/zally
  relationship: adjacent
  language: Kotlin / Java
  browser: false
  verified: true
  summary: >-
    An API linter with its own rules model, written in a JVM language, built by an organization
    that publishes its API guidelines publicly. Prior art for the "mandatory design rules as
    executable checks" pattern that European public-sector programmes later took much further.
  evidence: https://github.com/zalando/zally#readme
