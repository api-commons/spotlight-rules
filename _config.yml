title: Spotlight
name: Spotlight
description: >-
  An openly-governed, maintained build of the Spectral API linter — and the Spectral ruleset
  format as a standalone specification that stands on its own, apart from any one tool.
url: https://spotlight-rules.com
keywords:
  - Spectral
  - API governance
  - API linting
  - rulesets
  - OpenAPI
  - AsyncAPI
  - JSON Schema

author:
  name: API Commons
  email: apicommons@gmail.com

markdown: kramdown
highlighter: rouge

github_org: api-commons

discussion: https://github.com/orgs/api-commons/discussions/28
repo_cli: https://github.com/api-commons/spotlight-tools
repo_rules: https://github.com/api-commons/spotlight-spec
repo_fork: https://github.com/api-commons/spectral
email: info@apievangelist.com

# upstream
up_repo: https://github.com/stoplightio/spectral
up_issues: https://github.com/stoplightio/spectral/issues
up_pulls: https://github.com/stoplightio/spectral/pulls
acquisition: https://smartbear.com/news/news-releases/smartbear-to-acquire-stoplight/
telemetry_post: https://apievangelist.com/2026/07/02/if-youre-using-spectral-it-is-now-gathering-data-opt-out/
donate_post: https://apievangelist.com/2025/01/31/please-put-spectral-into-the-openapi-initiative-smartbear/
vacuum: https://github.com/daveshanley/vacuum
nl_adr: https://gitdocumentatie.logius.nl/publicatie/api/adr/2.2.1/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

permalink: pretty

defaults:
  - scope:
      path: ''
      type: posts
    values:
      layout: post
      nav: blog
      author: Kin Lane
